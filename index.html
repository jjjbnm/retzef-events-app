<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon-192.png"><title>Retzef events</title>
<style>
:root{font-family:Arial,sans-serif;color:#171329;background:#f7f5ff;--purple:#7c3aed;--ink:#171329;--muted:#716b85;--card:#fff;--line:#e9e3fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#e7ddff,transparent 35%),#f7f5ff;min-height:100vh}.wrap{max-width:920px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#21104d,#7c3aed);color:#fff;border-radius:28px;padding:30px 24px;margin-bottom:18px;box-shadow:0 18px 45px #5530a333}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}.hero h1{font-size:clamp(32px,8vw,60px);margin:8px 0}.hero p{line-height:1.7;max-width:620px;margin:0;color:#eee8ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#fff;color:#5b21b6}.secondary{background:#ffffff1f;color:#fff;border:1px solid #ffffff55}.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:25px 2px 12px}.section-title h2{margin:0}.section-title span{color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:9px 14px;white-space:nowrap;cursor:pointer}.filter.active{background:var(--purple);color:#fff;border-color:var(--purple)}.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.event{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 28px #5b21b60d}.event .date{display:inline-block;background:#f0e9ff;color:#6d28d9;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700}.event h3{margin:14px 0 7px}.event p{color:var(--muted);line-height:1.6;margin:0 0 15px;font-size:14px}.event-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}.empty{text-align:center;padding:30px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:34px}@media(max-width:560px){.wrap{padding:12px 12px 40px}.hero{padding:24px 18px;border-radius:22px}.actions .btn{flex:1;text-align:center}}
</style></head>
<body><style id="holidayNoticeOnlyStyle">body{min-height:100vh!important;margin:0!important;background:#7f1d1d!important;display:flex!important;align-items:center!important;justify-content:center!important;}body>*{display:none!important;}body>#holidayAvailabilityNotice{display:flex!important;position:fixed!important;inset:0!important;z-index:99999!important;align-items:center!important;justify-content:center!important;text-align:center!important;background:#7f1d1d!important;color:#fff!important;padding:24px!important;font-size:clamp(24px,5vw,48px)!important;font-weight:800!important;line-height:1.5!important;box-shadow:none!important;}</style><div id="holidayAvailabilityNotice" dir="rtl" role="status" style="position:sticky;top:0;z-index:9999;text-align:center;background:#7f1d1d;color:#fff;padding:12px 16px;font-weight:800;box-shadow:0 3px 12px #0004;">אנחנו לא זמינים כרגע — נחזור בצאת יום כיפור</div><main class="wrap"><section class="hero"><div class="eyebrow">קהילת רצף · אפליקציה</div><h1>Retzef events</h1><p>כל האירועים, המפגשים והעדכונים המיוחדים של קהילת רצף במקום אחד נוח.</p><div class="actions"><button class="btn primary" id="installBtn" hidden>התקנת האפליקציה</button><a class="btn secondary" href="https://chi-liart-74.vercel.app/">חזרה לאפליקציית רצף</a></div></section><section><div class="section-title"><h2>אירועים קרובים</h2><span id="count"></span></div><nav class="filters" aria-label="סינון אירועים"><button class="filter active" data-filter="all">הכול</button><button class="filter" data-filter="community">קהילה</button><button class="filter" data-filter="live">Live</button><button class="filter" data-filter="update">עדכונים</button><button class="filter" data-filter="holiday">חגים וחגיגות</button></nav><div class="events" id="events"></div></section><p class="foot">Retzef events · קהילת רצף · 2026</p></main>
<script>
const data=[
{cat:'community',date:'20 בספטמבר 2026',title:'מפגש קהילת רצף',desc:'מפגש קהילה מיוחד עם עדכונים, שאלות ותשובות והכרזות חדשות.',meta:'קהילה · בקרוב'},
{cat:'live',date:'24 בספטמבר 2026',title:'שידור Live מיוחד',desc:'שידור מיוחד של רצף עם חדשות, הפתעות ועדכונים למשתתפים.',meta:'Live · הודעה תישלח'},
{cat:'holiday',date:'31 באוקטובר 2026',title:'🎃 Halloween',desc:'אירוע Halloween מיוחד עם אווירה מפחידה, הפתעות ופעילות לקהילה.',meta:'חגיגה · 2026'},
{cat:'update',date:'1 באוקטובר 2026',title:'עדכון גדול לאפליקציות',desc:'גרסה חדשה עם שיפורים, תיקוני באגים ותכונות חדשות לקהילה.',meta:'עדכון · 2026'},
{cat:'holiday',date:'4–12 בדצמבר 2026',title:'🕎 חנוכה',desc:'אירוע חנוכה של קהילת רצף עם שמונה ימים של אור, עדכונים והפתעות.',meta:'חג · 2026'},
{cat:'holiday',date:'25 בדצמבר 2026',title:'🎄 Christmas',desc:'אירוע Christmas מיוחד עם ברכות, תוכן חגיגי והפתעה לקהילה.',meta:'חגיגה · 2026'},
{cat:'holiday',date:'1 בינואר 2027',title:'🎆 New Year',desc:'פותחים שנה חדשה יחד עם עדכונים, מטרות והכרזות של רצף.',meta:'שנה חדשה · 2027'},
{cat:'holiday',date:'23 בינואר 2027',title:'🎂 יום הולדת',desc:'אירוע יום הולדת חגיגי של קהילת רצף עם ברכות, הפתעות ופעילות מיוחדת.',meta:'חגיגה · 2027'},
{cat:'community',date:'25 בספטמבר 2026',title:'✨ One Year',desc:'חוגגים שנה מיוחדת לקהילת רצף עם סיכום, תודה והפתעות לחברים.',meta:'שנה לקהילה · 2026'},
{cat:'holiday',date:'22–23 במרץ 2027',title:'🎭 פורים',desc:'אירוע פורים שמח עם תחפושות, פעילות והפתעות לקהילה.',meta:'חג · 2027'},
{cat:'holiday',date:'21–29 באפריל 2027',title:'🍷 פסח',desc:'אירוע פסח של קהילת רצף עם ברכות ותוכן מיוחד לחג.',meta:'חג · 2027'},
{cat:'holiday',date:'11–12 במאי 2027',title:'🇮🇱 יום העצמאות',desc:'חוגגים את יום העצמאות עם הקהילה, ברכות ואירוע מיוחד.',meta:'חג לאומי · 2027'},
{cat:'community',date:'10 באוקטובר 2026',title:'אירוע קהילה פתוח',desc:'אירוע פתוח לכל חברי הקהילה. פרטים נוספים יפורסמו בקרוב.',meta:'קהילה · בהכנה'}];
const list=document.getElementById('events'),count=document.getElementById('count');function render(filter='all'){const items=data.filter(x=>filter==='all'||x.cat===filter);count.textContent=items.length+' אירועים';list.innerHTML=items.length?items.map(x=>`<article class="event"><span class="date">${x.date}</span><h3>${x.title}</h3><p>${x.desc}</p><div class="event-meta"><span>${x.meta}</span><span>רצף</span></div></article>`).join(''):'<div class="empty">אין כרגע אירועים בקטגוריה הזו.</div>'}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});render();let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('installBtn').hidden=false});document.getElementById('installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null};if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js');
</script></body></html>
